[project]
name = "pypx800v5"
version = "1.5.0"
description = "Control the IPX800V5 and its extensions."
authors = [{ name = "Aohzan", email = "aohzan@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/aohzan/pypx800v5"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["pypx800v5*"]

[tool.semantic_release]
# Existing release tags have no "v" prefix
tag_format = "{version}"
version_toml = ["pyproject.toml:project.version"]
build_command = """
    pip install uv
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.changelog]
default_templates = { changelog_file = "CHANGELOG.md" }
exclude_commit_patterns = [
    "^chore\\(deps",
    # Manual release commits made before semantic-release
    "^chore: \\d+\\.\\d+\\.\\d+ release",
]
